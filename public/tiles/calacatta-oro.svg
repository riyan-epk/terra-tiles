  <line x1="0" y1="256" x2="512" y2="256" stroke="#d4c5b5" stroke-width="0.5" opacity="0.15"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#d4c5b5" stroke-width="0.5" opacity="0.15"/>
